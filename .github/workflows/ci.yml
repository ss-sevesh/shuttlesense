name: Fresh-clone checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
      RAG_MISSING: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chrome
      - run: npm run test:portable
      - run: python -m pip install -r analysis/requirements-rag.txt numpy opencv-python-headless onnxruntime
      - run: python -m unittest discover -s analysis -p test_rag_chat.py
      - run: python -m unittest discover -s analysis -p test_chat_conversation.py
      - run: python -m unittest discover -s analysis -p test_download_rag.py
      - run: python -m unittest discover -s analysis -p test_shot_review.py
